services:
  - type: web
    name: vtalent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python mypro/manage.py collectstatic --noinput && python -c "from pathlib import Path; assert Path('mypro/staticfiles/staticfiles.json').is_file(), 'collectstatic manifest is missing'"
    startCommand: gunicorn --chdir mypro mypro.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
