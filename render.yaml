services:
  - type: web
    name: vtalent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python mypro/manage.py collectstatic --noinput && python -c "import json; from pathlib import Path; p=Path('mypro/staticfiles/staticfiles.json'); assert p.is_file(), 'collectstatic manifest is missing'; manifest=json.loads(p.read_text(encoding='utf-8')); assert 'vtalent-logo.png' in manifest.get('paths', {}), 'vtalent-logo.png is missing from collectstatic manifest'"
    startCommand: python mypro/manage.py collectstatic --noinput && gunicorn --chdir mypro mypro.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
