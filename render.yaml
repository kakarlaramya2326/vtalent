services:
  - type: web
    name: vtalent-admissions
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd mypro && python manage.py collectstatic --noinput
    startCommand: cd mypro && python manage.py migrate --noinput && gunicorn mypro.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOW_SQLITE
        value: "true"
